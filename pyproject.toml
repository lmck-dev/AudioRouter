[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiorouter"
version = "0.9.1"
description = "Route each application's audio to its own channel, with its own effects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
audiorouter = "audiorouter.cli:_entry"

[project.gui-scripts]
audiorouter-gui = "audiorouter.gui.main:_entry"

[tool.setuptools.packages.find]
include = ["audiorouter*"]

[tool.setuptools.package-data]
"audiorouter.native" = ["rnnoise/*.c", "rnnoise/*.ttl", "meter/*.c", "meter/*.ttl"]

[tool.ruff]
line-length = 100
target-version = "py311"
